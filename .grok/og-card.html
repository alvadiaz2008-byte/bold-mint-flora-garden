* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1200px;
  height: 630px;
  overflow: hidden;
  background: #0b0c0a;
}
.card {
  width: 1200px;
  height: 630px;
  position: relative;
  background: #0b0c0a;
  font-family: "AtlasNarrow", sans-serif;
  color: #ecebe3;
}
.wash {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 58% 52% at 50% 46%, #1a1d16 0%, #0b0c0a 72%);
}
.hatch {
  position: absolute;
  inset: 0;
  opacity: 0.07;
  background:
    repeating-linear-gradient(
      -32deg,
      transparent 0 22px,
      #8a9a6a 22px 23px
    );
}
.ghost {
  position: absolute;
  left: 50%;
  top: 46%;
  width: 520px;
  height: 520px;
  transform: translate(-50%, -54%);
  opacity: 0.07;
}
.frame {
  position: absolute;
  inset: 26px;
  border: 1px solid rgba(138,154,106,0.32);
  pointer-events: none;
}
.frame-inner {
  position: absolute;
  inset: 32px;
  border: 1px solid rgba(196,184,154,0.10);
  pointer-events: none;
}
.tick {
  position: absolute;
  width: 18px;
  height: 18px;
  border-color: #8a9a6a;
  border-style: solid;
  opacity: 0.7;
}
.tick.tl { top: 22px; left: 22px; border-width: 2px 0 0 2px; }
.tick.tr { top: 22px; right: 22px; border-width: 2px 2px 0 0; }
.tick.bl { bottom: 22px; left: 22px; border-width: 0 0 2px 2px; }
.tick.br { bottom: 22px; right: 22px; border-width: 0 2px 2px 0; }
.lockup {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 2;
}
.mark {
  width: 68px;
  height: 80px;
  margin-bottom: 26px;
  display: block;
}
.atlas {
  font-weight: 700;
  font-size: 96px;
  letter-spacing: 0.32em;
  line-height: 0.92;
  color: #ecebe3;
  text-indent: 0.32em;
  text-align: center;
}
.tactico {
  font-weight: 700;
  font-size: 42px;
  letter-spacing: 0.48em;
  line-height: 1;
  color: #8a9a6a;
  text-indent: 0.48em;
  text-align: center;
  margin-top: 14px;
}
.rule {
  width: 64px;
  height: 1px;
  background: #8a9a6a;
  margin: 24px 0 16px;
  opacity: 0.9;
}
.tag {
  font-weight: 400;
  font-size: 13px;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  color: #c4b89a;
  text-transform: uppercase;
  text-align: center;
}
.grain {
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.09;
  mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
</style>
</head>

  <div class="card">
    <div class="wash"></div>
    <div class="hatch"></div>
    <svg class="ghost" viewBox="0 0 64 76" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path fill="#8a9a6a" d="M32 2L62 14v28c0 16-16 26-30 32C18 68 2 58 2 42V14z"/>
    </svg>
    <div class="frame"></div>
    <div class="frame-inner"></div>
    <div class="tick tl"></div>
    <div class="tick tr"></div>
    <div class="tick bl"></div>
    <div class="tick br"></div>
    <div class="lockup">
      <svg class="mark" viewBox="0 0 64 76" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Atlas Táctico">
        <path fill="#8a9a6a" d="M32 2L62 14v28c0 16-16 26-30 32C18 68 2 58 2 42V14z"/>
        <path fill="#ecebe3" d="M32 26l22 30h-7.6L32 38.5 17.6 56H10z"/>
      </svg>
      <div class="atlas">ATLAS</div>
      <div class="tactico">TÁCTICO</div>
      <div class="rule"></div>
      <div class="tag">Equipo de servicio</div>
    </div>
    <div class="grain"></div>
  </div>
